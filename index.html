<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Helios Core – Photovoltaik-Dashboard für Erzeugung, Verbrauch, Powerwall, Netzeinspeisung, Wirtschaftlichkeit und Klimawirkung.">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark">
<title>Helios Core</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='4'/%3E%3Cpath d='M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'/%3E%3C/svg%3E">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root{
  color-scheme:dark;
  --bg:#0f172a;--surface:#1e293b;--surface-2:#273449;--line:#334155;--grid:#2b3a50;
  --text:#e2e8f0;--text-2:#cbd5e1;--muted:#94a3b8;
  --accent:#f59e0b;--accent-ink:#0f172a;
  /* one colour per metric – validated for CVD separation on --surface */
  --c-solar:#d37b0d;--c-self:#2cab70;--c-feed:#2a9bcb;--c-bat:#a353ba;--c-grid:#ce3e54;--c-money:#cd6199;--c-home:#94a3b8;
  /* status – deltas and score only, always paired with arrow/label */
  --pos:#4ade80;--neg:#fb7185;--warn:#fbbf24;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-sm:8px;--r:12px;
  --fs-xs:11px;--fs-s:12px;--fs-m:14px;--fs-l:16px;--fs-xl:22px;--fs-2xl:28px;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gut:16px;--maxw:1280px;
}
@media(min-width:768px){:root{--gut:32px}}
.m-solar{--m:var(--c-solar)}.m-self,.m-co2{--m:var(--c-self)}.m-feed{--m:var(--c-feed)}
.m-bat{--m:var(--c-bat)}.m-grid{--m:var(--c-grid)}.m-money{--m:var(--c-money)}.m-home{--m:var(--c-home)}
.st-pos{--st:var(--pos)}.st-warn{--st:var(--warn)}.st-neg{--st:var(--neg)}

/* ── Base ───────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;background:var(--bg);color:var(--text);font:var(--fs-m)/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band{padding-inline:max(var(--gut),calc((100% - var(--maxw))/2))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skip{position:fixed;top:var(--s3);left:var(--s3);z-index:100;padding:var(--s2) var(--s4);border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;transform:translateY(-200%)}
.skip:focus{transform:none}

/* ── Controls ───────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-width:40px;height:40px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:var(--fs-s);font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{background:var(--surface-2)}
.btn:has(:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.link{border:0;background:none;color:var(--accent);font-size:var(--fs-s);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.sel{height:32px;padding:0 var(--s2);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);font-size:var(--fs-s);cursor:pointer}
@media(max-width:640px){.btn .lbl{display:none}.top .btn{padding:0}}

/* ── Header ─────────────────────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:var(--s3);padding-block:var(--s3)}
.logo{width:36px;height:36px;padding:7px;border-radius:10px;background:var(--accent);color:var(--accent-ink);stroke-width:2.2}
.brand{flex:1;min-width:0}
.brand h1{font-size:var(--fs-l);line-height:1.25}
.brand p{overflow:hidden;color:var(--muted);font-size:var(--fs-s);white-space:nowrap;text-overflow:ellipsis}

/* ── KPI strip ──────────────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3);padding-block:var(--s3) var(--s4)}
.kpis .stat{background:none;border:0;padding:0;border-left:1px solid var(--line);padding-left:var(--s3);border-radius:0}
.kpis .stat:first-child{border-left:0;padding-left:0}
.kpis .stat-v{font-size:var(--fs-l)}
@media(max-width:767px){
  .kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gut);scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpis .stat{flex:0 0 40%;scroll-snap-align:start}
}

/* ── Dock: settings + tabs (sticky) ─────────────────────────────────────── */
.dock{position:sticky;top:0;z-index:10;background:var(--bg);border-block:1px solid var(--line)}
.settings{max-height:60vh;overflow-y:auto;padding-block:var(--s4);border-bottom:1px solid var(--line);background:var(--surface)}
.settings-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.settings-h h2{font-size:var(--fs-m)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));align-items:end;gap:var(--s3)}
.field{display:grid;gap:var(--s1);min-width:0;font-size:var(--fs-s);color:var(--text-2)}
.input{display:flex;align-items:center;min-width:0;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);transition:border-color .15s}
.input:focus-within{border-color:var(--accent)}
.input:has([aria-invalid=true]){border-color:var(--neg)}
.input input{flex:1;min-width:0;height:40px;padding:0 var(--s2) 0 var(--s3);border:0;background:none;font-weight:600;outline:none;-moz-appearance:textfield}
.input input::-webkit-inner-spin-button,.input input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.input span{padding-right:var(--s2);color:var(--muted);font-size:var(--fs-s)}
.field small{display:none;color:var(--neg);font-size:var(--fs-xs)}
.field:has([aria-invalid=true]) small{display:block}
.data-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);margin-top:var(--s4);color:var(--muted);font-size:var(--fs-s)}
.data-row b{color:var(--text)}
.data-row a{color:var(--accent)}
@media(pointer:coarse){.dnd{display:none}}

[role=tablist]{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none}
[role=tablist]::-webkit-scrollbar{display:none}
[role=tab]{display:flex;align-items:center;gap:var(--s2);height:48px;padding:0 var(--s3);border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer;transition:color .15s,border-color .15s}
[role=tab]:hover{color:var(--text)}
[role=tab][aria-selected=true]{border-bottom-color:var(--accent);color:var(--text)}
[role=tab][aria-selected=true] .i{color:var(--accent)}
[role=tab]:focus-visible{outline-offset:-2px}
@media(max-width:640px){
  .tabs{padding-inline:var(--s1)}
  [role=tablist]{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
  [role=tab]{flex-direction:column;justify-content:center;gap:2px;height:56px;padding:0 2px;font-size:var(--fs-xs)}
  .lg{display:none}
}

/* ── Layout ─────────────────────────────────────────────────────────────── */
main{padding-block:var(--s4) var(--s6);outline:none}
.view{display:grid;gap:var(--s4)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:var(--s4)}
.card{min-width:0;padding:var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.card h3{font-size:var(--fs-m);font-weight:600}
.note{margin-top:var(--s3);color:var(--muted);font-size:var(--fs-xs)}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:var(--fs-s);text-align:center}

/* ── Stat ───────────────────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{min-width:0;padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stat-l{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:var(--fs-s)}
.stat-l::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--m)}
.eyebrow{color:var(--muted);font-size:var(--fs-s)}
.stat-v{margin-top:var(--s1);font-size:var(--fs-xl);font-weight:700;line-height:1.2}
.stat-v small{margin-left:4px;color:var(--muted);font-size:var(--fs-s);font-weight:600}
.stat-s{margin-top:2px;color:var(--muted);font-size:var(--fs-s)}
.delta{display:inline-block;margin-top:var(--s2);padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--st,var(--muted)) 14%,transparent);color:var(--st,var(--muted));font-size:var(--fs-xs);font-weight:600}
.delta span{margin-left:2px;font-weight:400;opacity:.85}
@media(max-width:400px){.stat{padding:var(--s3)}.stat-v{font-size:var(--fs-l)}}

/* ── Meter & score ──────────────────────────────────────────────────────── */
.score{display:flex;align-items:center;gap:var(--s5)}
.ring{position:relative;flex:none;width:96px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .tr{stroke:var(--surface-2)}
.ring .vl{stroke:var(--st);stroke-linecap:round;stroke-dasharray:calc(263.9px * var(--p)) 999px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-2xl)}
.score-body{flex:1;min-width:0}
.score-r{margin:2px 0 var(--s3);font-size:var(--fs-l);font-weight:700}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:var(--s3) var(--s5)}
.meter{display:grid;grid-template-columns:1fr auto;gap:4px var(--s2);font-size:var(--fs-s)}
.meter span{color:var(--text-2)}
.meter small{color:var(--muted)}
.meter i{grid-column:1/-1;height:6px;overflow:hidden;border-radius:3px;background:var(--surface-2)}
.meter i::after{content:'';display:block;height:100%;background:var(--m);transform:scaleX(var(--v));transform-origin:left}
@media(max-width:400px){.score{gap:var(--s4)}.ring{width:80px}}

/* ── Lists ──────────────────────────────────────────────────────────────── */
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--s3) var(--s5);margin-top:var(--s3);list-style:none}
.list li{display:grid;grid-template-columns:auto 1fr;gap:2px var(--s3);color:var(--text-2);font-size:var(--fs-s)}
.list .i{grid-row:span 2;width:20px;height:20px;color:var(--accent)}
.list b{color:var(--text)}
.insights summary{display:flex;align-items:center;gap:var(--s2);font-weight:600;list-style:none;cursor:pointer}
.insights summary::-webkit-details-marker{display:none}
.insights summary small{color:var(--muted);font-weight:400}
.insights summary .i{margin-left:auto;transition:transform .2s}
.insights[open] summary .i{transform:rotate(180deg)}
.insights ul{display:grid;gap:var(--s2);margin-top:var(--s3);padding-left:var(--s4)}
.insights li{color:var(--text-2);font-size:var(--fs-s);line-height:1.55}
.insights li::marker{color:var(--accent)}
.insights strong{color:var(--text)}

/* ── Table ──────────────────────────────────────────────────────────────── */
.tbl-wrap{margin-top:var(--s3);overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-s);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th,.tbl td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);text-align:right}
.tbl th{color:var(--muted);font-size:var(--fs-xs);font-weight:600;vertical-align:bottom}
.tbl th small{display:block;font-weight:400}
.tbl td{color:var(--text-2)}
.tbl :is(th,td):first-child{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left}
.tbl td:first-child{color:var(--text);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl .best{color:var(--text);font-weight:700}
.tbl .fc td:not(:first-child){color:var(--muted)}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:600;vertical-align:1px}

/* ── Chart ──────────────────────────────────────────────────────────────── */
.chart figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s2);min-height:32px}
.chart .unit{color:var(--muted);font-size:var(--fs-s)}
.act{margin-left:auto}
.legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);margin-top:var(--s2);color:var(--text-2);font-size:var(--fs-s);list-style:none}
.legend:empty{display:none}
.legend li{display:flex;align-items:center;gap:6px}
.sw{flex:none;width:10px;height:10px;border-radius:3px;background:var(--m)}
.sw.pt{opacity:.45}
.sw.md{border:1.5px dashed var(--m);background:color-mix(in srgb,var(--m) 15%,transparent)}
.sw.ln{width:14px;height:2px;border-radius:1px}
.sw.ln.md{height:0;border-width:2px 0 0;background:none}
.sw.dot{border:2px solid var(--m);border-radius:50%;background:none}
.plot{position:relative;height:220px;margin-top:var(--s3);border-radius:4px;outline-offset:4px;touch-action:pan-y}
@media(min-width:768px){.plot{height:250px}}
.plot svg{display:block;overflow:visible}
.ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);shape-rendering:crispEdges}
.bl{stroke:var(--line);shape-rendering:crispEdges}
.hov{fill:var(--text);fill-opacity:.05}
.b{fill:var(--m)}
.b.pt{fill-opacity:.45}
.b.md{fill-opacity:.15;stroke:var(--m);stroke-width:1.5;stroke-dasharray:3 3}
.ln{fill:none;stroke:var(--m);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ln.md{stroke-dasharray:5 4}
.ar{fill:var(--m);fill-opacity:.1}
.pt-m{fill:var(--m);stroke:var(--surface);stroke-width:2}
.pt-m.o{fill:var(--surface);stroke:var(--m)}
.ref{stroke:var(--text-2);stroke-dasharray:4 3;shape-rendering:crispEdges}
.ref-l{fill:var(--text-2);font-size:11px}
.tip{position:absolute;top:0;left:0;z-index:2;min-width:150px;padding:var(--s2) var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);box-shadow:0 8px 24px rgb(0 0 0/.35);font-size:var(--fs-s);pointer-events:none}
.tip p{margin-bottom:4px;font-weight:600}
.tip ul{display:grid;gap:2px;list-style:none}
.tip li{display:flex;align-items:center;gap:6px;color:var(--text-2)}
.tip li b{margin-left:auto;padding-left:var(--s3);color:var(--text);font-variant-numeric:tabular-nums}
.tip .sum{margin-top:2px;padding-top:4px;border-top:1px solid var(--line)}

/* ── Feedback ───────────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:var(--s4);left:50%;z-index:50;max-width:calc(100% - 2 * var(--s4));padding:var(--s2) var(--s4);border:1px solid var(--line);border-left:3px solid var(--pos);border-radius:var(--r-sm);background:var(--surface-2);font-size:var(--fs-s);opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-left-color:var(--neg)}
body.dragging::after{content:'CSV hier ablegen';position:fixed;inset:var(--s3);z-index:60;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--accent);font-size:var(--fs-xl);font-weight:700;pointer-events:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9v12h14V9M10 21v-6h4v6"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M11 9.5 8.5 12h4L10 14.5"/></symbol>
  <symbol id="i-euro" viewBox="0 0 24 24"><path d="M18 6.6A7 7 0 1 0 18 17.4M4 10h10M4 14h10"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 20c0-9 5.5-14.5 15-16 0 10-5.5 16-15 16ZM5 20l7-7"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M3 21h18M8 7h4M8 11h4M8 15h4"/></symbol>
</svg>
<a class="skip" href="#main">Zum Inhalt springen</a>

<header class="top band">
  <svg class="i logo" aria-hidden="true"><use href="#i-sun"/></svg>
  <div class="brand">
    <h1>Helios Core</h1>
    <p id="meta">Photovoltaik-Analyse</p>
  </div>
  <button class="btn" id="btn-settings" aria-expanded="false" aria-controls="settings" aria-label="Annahmen">
    <svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg><span class="lbl">Annahmen</span>
  </button>
  <label class="btn">
    <svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span class="lbl">CSV laden</span>
    <input type="file" class="sr-only" data-csv accept=".csv,text/csv" aria-label="CSV-Datei laden">
  </label>
</header>

<section class="kpis band" id="kpis" aria-label="Kennzahlen"></section>

<div class="dock" id="dock">
  <section class="settings band" id="settings" aria-labelledby="settings-h" hidden>
    <div class="settings-h">
      <h2 id="settings-h">Annahmen</h2>
      <button class="btn ghost" data-close aria-label="Annahmen schließen"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="fields">
      <label class="field">Strompreis
        <span class="input"><input id="in-buy" type="number" inputmode="decimal" min="1" max="150" step="0.5"><span>ct/kWh</span></span>
        <small>Erlaubt: 1–150 ct</small>
      </label>
      <label class="field">Einspeisevergütung
        <span class="input"><input id="in-sell" type="number" inputmode="decimal" min="0" max="50" step="0.1"><span>ct/kWh</span></span>
        <small>Erlaubt: 0–50 ct</small>
      </label>
      <label class="field">Anlagekosten

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════════
// CONSTANTS & STATE
// ═══════════════════════════════════════════════════════════════════════════
const CO2_KG = 0.38;          // kg CO₂ per kWh, German grid mix (UBA 2023)
const TREE_KG = 21;           // kg CO₂ bound by one tree per year
const CAR_G_KM = 120;         // g CO₂ per km, average petrol car
const FLIGHT_KG = 800;        // kg CO₂ per FRA–JFK flight
const HOUSEHOLD_MWH = 3.5;    // annual demand of an average household
const DEGRADATION = 0.005;    // module output loss per year
const FULL_YEAR_SHARE = 0.6;  // annual data: below 60 % of the best year = partial year
const HORIZON = 2030;
const MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONTH_SHARE = [.03,.05,.08,.11,.13,.14,.13,.11,.09,.06,.04,.03]; // typical PV yield distribution
const SAMPLE = [ // mirrors data.csv
  {year:2022, home:1.3, powerwall:0.38, solar:2.4,  fromGrid:0.48, toGrid:1.5},
  {year:2023, home:2.6, powerwall:1.0,  solar:10.0, fromGrid:0.54, toGrid:7.7},
  {year:2024, home:2.6, powerwall:1.0,  solar:10.4, fromGrid:0.42, toGrid:8.0},
  {year:2025, home:2.3, powerwall:1.1,  solar:10.4, fromGrid:0.15, toGrid:7.8},
  {year:2026, home:1.2, powerwall:0.46, solar:3.2,  fromGrid:0.17, toGrid:2.0},
];
const LIMITS = {buy:[1,150], sell:[0,50], cost:[1000,200000]};
const STORE_KEY = 'helios:v1';

const state = {buy:30, sell:8, cost:15000, rows:SAMPLE, source:null};
let data = null;     // derived from state, see derive()
let current = null;  // active view id

const $ = s => document.querySelector(s);

// ═══════════════════════════════════════════════════════════════════════════
// FORMATTING
// ═══════════════════════════════════════════════════════════════════════════
const NBSP = ' ';
const NF = [0, 1, 2].map(d => new Intl.NumberFormat('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d}));
const num = (n, d = 1) => NF[d].format(n).replace('-', '−');
const signed = (n, d = 1) => (n > 0 ? '+' : '') + num(n, d);
const pct = (n, d = 1) => num(n, d) + NBSP + '%';
const eur = n => num(n, 0) + NBSP + '€';
const kg = n => num(n, 0) + NBSP + 'kg';
const ct = n => num(n, Number.isInteger(n) ? 0 : 1);
const energy = mwh => Math.abs(mwh) < 1 ? [num(mwh * 1000, 0), 'kWh'] : [num(mwh, 1), 'MWh'];
const E = mwh => energy(mwh).join(NBSP);
const span = ys => ys.length > 1 ? `${ys[0].year}–${ys.at(-1).year}` : String(ys[0].year);

// ═══════════════════════════════════════════════════════════════════════════
// CSV
// ═══════════════════════════════════════════════════════════════════════════
const toNum = s => {
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); // German decimal comma
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
};

function parseDate(s) {
  let m = s.match(/^(\d{4})(?:-(\d{1,2}))?/);
  if (m) return {year:+m[1], month:+(m[2] || 1)};
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  return m ? {year:+m[3], month:+m[2]} : null;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) throw new Error('Die CSV enthält keine Datenzeilen.');
  const sep = lines[0].includes(';') ? ';' : ',';
  const cells = l => l.split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
  const head = cells(lines[0]).map(h => h.toLowerCase());
  const col = key => {
    const i = head.findIndex(h => h.includes(key));
    if (i < 0) throw new Error(`Spalte „${key}“ fehlt in der CSV.`);
    return {i, scale: head[i].includes('kwh') ? 0.001 : 1}; // normalise to MWh
  };
  const cols = {home:col('home'), powerwall:col('powerwall'), solar:col('solar'), fromGrid:col('from grid'), toGrid:col('to grid')};
  const rows = [];
  for (const line of lines.slice(1)) {
    const c = cells(line), date = parseDate(c[0] || '');
    if (!date) continue;
    const row = {...date};
    for (const [k, {i, scale}] of Object.entries(cols)) row[k] = toNum(c[i] || '') * scale;
    rows.push(row);
  }
  if (!rows.length) throw new Error('Keine gültigen Datenzeilen gefunden.');
  return rows.sort((a, b) => a.year - b.year || a.month - b.month);
}

// ═══════════════════════════════════════════════════════════════════════════
// DERIVE — every number shown in the UI comes from here
// ═══════════════════════════════════════════════════════════════════════════
const sum = (arr, k) => arr.reduce((s, x) => s + (x[k] || 0), 0);
const mean = (arr, k) => arr.length ? sum(arr, k) / arr.length : 0;
const best = (arr, k, low = false) => arr.reduce((b, x) => (low ? x[k] < b[k] : x[k] > b[k]) ? x : b);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const ratio = (a, b) => b ? a / b : 0;

function derive({rows, buy, sell, cost}) {
  const BUY = buy / 100, SELL = sell / 100;
  const byYear = new Map();
  for (const r of rows) {
    let y = byYear.get(r.year);
    if (!y) byYear.set(r.year, y = {year:r.year, home:0, pw:0, solar:0, fgrid:0, tgrid:0, months:[]});
    y.home += r.home; y.pw += r.powerwall; y.solar += r.solar; y.fgrid += r.fromGrid; y.tgrid += r.toGrid;
    y.months.push(r);
  }
  const isMonthly = rows.length > byYear.size;
  const thisYear = new Date().getFullYear();
  const maxSolar = Math.max(...[...byYear.values()].map(y => y.solar));

  const Y = [...byYear.values()].sort((a, b) => a.year - b.year).map(y => {
    const self = Math.max(0, y.solar - y.tgrid);
    return {
      ...y, self,
      full: isMonthly ? new Set(y.months.map(m => m.month)).size === 12
                      : y.year < thisYear && y.solar >= FULL_YEAR_SHARE * maxSolar,
      direct: Math.max(0, y.home - y.pw - y.fgrid),
      autarky: ratio(y.home - y.fgrid, y.home) * 100,
      evq: ratio(self, y.solar) * 100,
      co2: self * 1000 * CO2_KG,
      savSelf: self * 1000 * BUY,
      savFeed: y.tgrid * 1000 * SELL,
      sav: self * 1000 * BUY + y.tgrid * 1000 * SELL,
    };
  });

  const fullYears = Y.filter(y => y.full);
  const F = fullYears.length ? fullYears : Y;     // reference years for averages and records
  const last = Y.at(-1), lf = F.at(-1), ff = F[0], pf = F.at(-2) || null;
  const tot = Object.fromEntries(['solar','home','pw','fgrid','tgrid','self','co2','sav','savFeed'].map(k => [k, sum(Y, k)]));
  const evqShare = ratio(sum(F, 'self'), sum(F, 'solar'));
  const avg = {solar:mean(F, 'solar'), home:mean(F, 'home'), sav:mean(F, 'sav'), co2:mean(F, 'co2'), evq:evqShare * 100};

  // Forecast: mean of full years, degrading from the last full year, constant self-consumption share
  const project = year => {
    const solar = avg.solar * (1 - DEGRADATION) ** (year - lf.year);
    const self = solar * evqShare, tgrid = solar - self;
    return {year, solar, self, tgrid, sav: self * 1000 * BUY + tgrid * 1000 * SELL, co2: self * 1000 * CO2_KG};
  };
  const runningYear = !last.full && last.year > lf.year ? last : null;
  const fcRunning = runningYear && project(runningYear.year);
  const horizon = Math.max(HORIZON, lf.year + 3);
  const future = [];
  for (let y = last.year + 1; y <= horizon; y++) future.push(project(y));

  // Timeline of projected full-year values: actuals, running year topped up to its forecast, future years
  const keys = ['solar','self','tgrid','sav','co2'];
  const timeline = [
    ...Y.map(y => y === runningYear
      ? {year:y.year, kind:'running', ...Object.fromEntries(keys.map(k => [k, Math.max(y[k], fcRunning[k])]))}
      : {...y, kind: y.full ? 'full' : 'partial'}),
    ...future.map(f => ({...f, kind:'future'})),
  ];
  const proj = {sav: sum(timeline, 'sav'), co2: sum(timeline, 'co2')};

  // Amortisation
  let cum = 0, paybackYear = null;
  for (const t of timeline) if ((cum += t.sav) >= cost && !paybackYear) paybackYear = t.year;
  for (let y = horizon + 1; !paybackYear && y <= lf.year + 40; y++) if ((cum += project(y).sav) >= cost) paybackYear = y;
  const roi = {
    progress: Math.min(1, tot.sav / cost),
    years: avg.sav > 0 ? cost / avg.sav : Infinity,
    remaining: Math.max(0, cost - tot.sav),
    paybackYear,
  };

  // Grid-independence score (last full year): autarky 65 %, storage coverage 20 %, progress 15 %
  const parts = [
    {m:'self', label:'Autarkie', w:65, v:lf.autarky / 100},
    {m:'bat',  label:'Speicherdeckung', w:20, v:ratio(lf.pw, lf.pw + lf.fgrid)},
    {m:'home', label:`Entwicklung seit ${ff.year}`, w:15,
     v: F.length > 1 ? clamp((lf.autarky - ff.autarky) / Math.max(1, 100 - ff.autarky), 0, 1) : .5},
  ];
  const score = Math.round(parts.reduce((s, p) => s + p.v * p.w, 0));

  return {Y, F, last, lf, ff, pf, tot, avg, evqShare, runningYear, fcRunning, future, horizon, timeline, proj,
          roi, parts, score, isMonthly, project, buy, sell, cost};
}

// ═══════════════════════════════════════════════════════════════════════════
// SVG CHARTS — small, dependency-free renderer (bars: single/stacked/grouped, lines)
// ═══════════════════════════════════════════════════════════════════════════
const r1 = v => Math.round(v * 10) / 10;

function ticks(lo, hi, count) {
  if (hi <= lo) hi = lo + 1;
  const raw = (hi - lo) / count, p = 10 ** Math.floor(Math.log10(raw)), e = raw / p;
  const step = (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1) * p;
  const t = [];
  for (let v = Math.floor(lo / step + 1e-9) * step; v <= hi + step * .999; v += step) t.push(+v.toFixed(10));
  return {t, dec: Math.max(0, -Math.floor(Math.log10(step) + 1e-9))};
}

// Bar with 4px rounded data end, square at the baseline
function barPath(x, yb, ye, w, r) {
  const dir = ye < yb ? 1 : -1;
  r = Math.min(r, Math.abs(yb - ye), w / 2);
  [x, w, yb, ye] = [r1(x), r1(w), r1(yb), r1(ye)];
  const yr = r1(ye + dir * r);
  return `M${x},${yb}V${yr}Q${x},${ye} ${r1(x + r)},${ye}H${r1(x + w - r)}Q${r1(x + w)},${ye} ${r1(x + w)},${yr}V${yb}Z`;
}

const swatch = x => `<i class="sw m-${x.m}${x.model ? ' md' : ''}${x.type === 'line' ? ' ln' : ''}"></i>`;

function legendHtml(s) {
  const hasBars = s.series.some(x => x.type !== 'line');
  const items = s.series.length > 1 || s.refs || s.series.some(x => x.model) ? s.series.map(x => `<li>${swatch(x)}${x.label}</li>`) : [];
  if (s.styles?.includes('pt')) items.push(`<li><i class="sw m-home ${hasBars ? 'pt' : 'dot'}"></i>Teiljahr</li>`);
  if (s.styles?.includes('md') && !s.series.some(x => x.model)) items.push('<li><i class="sw m-home ln md"></i>Prognose</li>');
  return items.join('');
}

function drawChart(plot) {
  const w = plot.clientWidth;
  if (!w) return;
  const def = CHARTS[plot.dataset.chart], s = def.spec(data, plot), fig = plot.parentNode;
  s.unit ??= def.unit;
  s.fmt ??= v => (s.signed ? signed(v, s.dec ?? 1) : num(v, s.dec ?? 1)) + NBSP + s.unit;
  Object.assign(plot, {_w:w, _dirty:false, _s:s, _i:null, _g:null});

  fig.querySelector('.legend').innerHTML = legendHtml(s);
  const act = !def.act && fig.querySelector('.act'); // empty `act` = slot filled by the spec
  if (act && act._html !== (s.action ?? '')) act.innerHTML = act._html = s.action ?? '';
  if (act && s.actionValue != null) act.firstChild.value = s.actionValue;
  if (s.empty) { plot.innerHTML = `<p class="empty">${s.empty}</p>`; plot.setAttribute('aria-label', `${def.title}: ${s.empty}`); return; }

  const h = plot.clientHeight, n = s.labels.length;
  const bars = s.series.filter(x => x.type !== 'line'), lines = s.series.filter(x => x.type === 'line');

  // Domain (stacked bars sum per sign)
  let lo = s.yMin ?? 0, hi = s.yMax ?? 0;
  const take = v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } };
  for (let i = 0; i < n; i++) {
    if (s.stacked) {
      let p = 0, m = 0;
      for (const b of bars) { const v = b.data[i] ?? 0; v > 0 ? p += v : m += v; }
      take(p); take(m);
    } else bars.forEach(b => take(b.data[i]));
    lines.forEach(l => take(l.data[i]));
  }
  (s.refs || []).forEach(r => take(r.value));

  const {t, dec} = ticks(lo, hi, h < 240 ? 4 : 5);
  const tl = t.map(v => (s.signed && v > 0 ? '+' : '') + num(v, dec));
  const padL = Math.ceil(Math.max(...tl.map(x => x.length)) * 6.4) + 10, padR = 4, padT = 8, padB = 24;
  const iw = w - padL - padR, ih = h - padT - padB, t0 = t[0], t1 = t.at(-1);
  const Y = v => padT + ih - (v - t0) / (t1 - t0) * ih;
  const band = iw / n, cx = i => padL + band * (i + .5);
  let out = '';

  t.forEach((v, k) => {
    const y = Math.round(Y(v)) + .5;
    out += `<line class="${v === 0 ? 'bl' : 'gl'}" x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}"/>`
         + `<text class="ax" x="${padL - 8}" y="${y}" dy=".32em" text-anchor="end">${tl[k]}</text>`;
  });
  out += `<rect class="hov" y="${padT}" width="${r1(band)}" height="${r1(ih)}" visibility="hidden"/>`;

  // Bars: ≤24px thick, 2px surface gap between grouped bars and stacked segments
  const groups = s.stacked ? 1 : bars.length, GAP = 2;
  const bw = clamp((band * .7 - GAP * (groups - 1)) / groups, 2, 24);
  for (let i = 0; i < n; i++) {
    const x0 = cx(i) - (bw * groups + GAP * (groups - 1)) / 2;
    let pos = 0, neg = 0;
    bars.forEach((b, j) => {
      const v = b.data[i];
      if (!v) return;
      const style = b.model ? 'md' : s.styles?.[i] || '';
      let base = 0, x = x0 + j * (bw + GAP);
      if (s.stacked) { x = x0; base = v > 0 ? pos : neg; v > 0 ? pos += v : neg += v; }
      const top = !s.stacked || !bars.slice(j + 1).some(o => Math.sign(o.data[i] || 0) === Math.sign(v));
      const yb = Y(base) - (base ? Math.sign(v) * GAP : 0), ye = Y(base + v);
      if (Math.abs(yb - ye) < .5) return;
      out += `<path class="b m-${b.m}${style ? ' ' + style : ''}" d="${barPath(x, yb, ye, bw, top ? 4 : 0)}"/>`;
    });
  }

  // Lines: 2px, dashed into projected points, 10 % area wash, 8px markers with surface ring
  for (const l of lines) {
    const pts = l.data.map((v, i) => v == null ? null : [r1(cx(i)), r1(Y(v))]);
    let solid = '', dashed = '';
    for (let i = 1; i < n; i++) {
      const a = pts[i - 1], b = pts[i];
      if (!a || !b) continue;
      const seg = `M${a}L${b}`;
      s.styles?.[i] === 'md' ? dashed += seg : solid += seg;
    }
    if (l.area) {
      const p = pts.filter(Boolean), y0 = r1(Y(Math.max(0, t0)));
      out += `<path class="ar m-${l.m}" d="M${p[0][0]},${y0}L${p.join('L')}L${p.at(-1)[0]},${y0}Z"/>`;
    }
    if (solid) out += `<path class="ln m-${l.m}" d="${solid}"/>`;
    if (dashed) out += `<path class="ln md m-${l.m}" d="${dashed}"/>`;
    pts.forEach((p, i) => { if (p) out += `<circle class="pt-m m-${l.m}${s.styles?.[i] ? ' o' : ''}" cx="${p[0]}" cy="${p[1]}" r="4"/>`; });
  }

  for (const r of s.refs || []) {
    const y = Math.round(Y(r.value)) + .5;
    out += `<line class="ref" x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}"/>`
         + `<text class="ref-l" x="${padL + 4}" y="${y - 6}">${r.label}</text>`;
  }

  // X labels: short form or every n-th label when the band gets narrow
  const width = arr => Math.max(...arr.map(x => x.length)) * 6.4;
  const xl = s.short && width(s.labels) > band - 4 ? s.short : s.labels;
  const every = Math.max(1, Math.ceil(width(xl) / (band - 2)));
  xl.forEach((l, i) => { if (i % every === 0) out += `<text class="ax" x="${r1(cx(i))}" y="${h - 6}" text-anchor="middle">${l}</text>`; });

  plot._g = {x0:padL, band, padT};
  plot.innerHTML = `<svg width="${w}" height="${h}" aria-hidden="true">${out}</svg><div class="tip" hidden></div>`;
  plot.setAttribute('aria-label', `${def.title} (${s.unit}): ` + s.labels.map((l, i) =>
    `${l}${s.tags?.[i] ? ' ' + s.tags[i] : ''}: ` + s.series.filter(x => x.data[i] != null)
      .map(x => (s.series.length > 1 ? x.label + ' ' : '') + s.fmt(x.data[i])).join(', ')).join('; '));
}

function showTip(plot, i) {
  const s = plot._s, g = plot._g;
  if (!g) return;
  i = clamp(i, 0, s.labels.length - 1);
  if (i === plot._i) return;
  plot._i = i;
  const rows = s.series.filter(x => x.data[i] != null).map(x => `<li>${swatch(x)}${x.label}<b>${s.fmt(x.data[i])}</b></li>`);
  if (s.stacked && rows.length > 1) rows.push(`<li class="sum">Gesamt<b>${s.fmt(s.series.reduce((a, x) => a + (x.data[i] || 0), 0))}</b></li>`);
  const tip = plot.lastChild;
  tip.innerHTML = `<p>${s.labels[i]}${s.tags?.[i] ? `<span class="tag">${s.tags[i]}</span>` : ''}</p><ul>${rows.join('')}</ul>`;
  tip.hidden = false;
  const hov = plot.querySelector('.hov');
  hov.setAttribute('x', r1(g.x0 + g.band * i));
  hov.setAttribute('visibility', 'visible');
  const c = g.x0 + g.band * (i + .5), tw = tip.offsetWidth;
  const left = c + 12 + tw > plot._w ? Math.max(0, c - 12 - tw) : c + 12;
  tip.style.transform = `translate(${r1(left)}px,${g.padT}px)`;
}

function hideTip(plot) {
  if (!plot?._g) return;
  plot._i = null;
  plot.lastChild.hidden = true;
  plot.querySelector('.hov').setAttribute('visibility', 'hidden');
}

// ── Chart specs ────────────────────────────────────────────────────────────
const tagOf = y => y.full ? '' : 'Teiljahr';

function yearly(d, series, opts = {}) {
  return {
    labels: d.Y.map(y => String(y.year)),
    tags: d.Y.map(tagOf),
    styles: d.Y.map(y => y.full ? '' : 'pt'),
    series: series.map(x => ({...x, data: d.Y.map(y => y[x.k])})),
    ...opts,
  };
}

function cumulative(d, k, m, label, extend = 0) {
  const T = [...d.timeline];
  for (let y = d.horizon + 1; y <= extend; y++) T.push({...d.project(y), kind:'future'});
  let c = 0;
  return {
    labels: T.map(t => String(t.year)),
    tags: T.map(t => ({partial:'Teiljahr', running:'Hochrechnung', future:'Prognose'})[t.kind] || ''),
    styles: T.map(t => t.kind === 'running' || t.kind === 'future' ? 'md' : ''),
    series: [{m, label, type:'line', area:true, data: T.map(t => c += t[k])}],
    dec: 0,
  };
}

function monthSpec(d, plot) {
  if (!d.isMonthly) return {
    labels: MONTHS, short: MONTHS.map(m => m[0]), dec: 0,
    series: [{m:'solar', label:`Modell: Ø-Volljahr ${span(d.F)}`, model:true, data: MONTH_SHARE.map(f => f * d.avg.solar * 1000)}],
  };
  const years = d.Y.map(y => y.year);
  const year = years.includes(plot._year) ? plot._year : years.at(-1);
  const solar = Array(12).fill(null), home = Array(12).fill(null);
  for (const r of d.Y.find(y => y.year === year).months) { solar[r.month - 1] = r.solar * 1000; home[r.month - 1] = r.home * 1000; }
  return {
    labels: MONTHS, short: MONTHS.map(m => m[0]), dec: 0,
    series: [{m:'solar', label:'Erzeugung', data:solar}, {m:'home', label:'Verbrauch', type:'line', data:home}],
    action: `<select class="sel" data-month aria-label="Jahr">${years.map(y => `<option>${y}</option>`).join('')}</select>`,
    actionValue: year,
  };
}

function forecastSpec(d) {
  const rows = [...d.Y, ...d.future];
  return {
    labels: rows.map(y => String(y.year)),
    tags: rows.map(y => y.full ? '' : y === d.runningYear ? 'Teiljahr + Prognose' : 'months' in y ? 'Teiljahr' : 'Prognose'),
    styles: rows.map(y => y.full || !('months' in y) ? '' : 'pt'),
    stacked: true,
    series: [
      {m:'solar', label:'Ist', data: rows.map(y => 'months' in y ? y.solar : null)},
      {m:'solar', label:'Prognose', model:true, data: rows.map(y =>
        y === d.runningYear ? Math.max(0, d.fcRunning.solar - y.solar) : 'months' in y ? null : y.solar)},
    ],
  };
}

function yoySpec(d) {
  if (d.F.length < 2 || d.F.some(y => !y.full)) return {empty:'Für den Vorjahresvergleich sind mindestens zwei Volljahre nötig.', series:[]};
  const pairs = d.F.slice(1).map((y, i) => [d.F[i], y]);
  const ch = k => pairs.map(([a, b]) => a[k] ? (b[k] / a[k] - 1) * 100 : null);
  return {
    labels: pairs.map(([a, b]) => `${a.year}→${b.year}`),
    short: pairs.map(([a, b]) => `${String(a.year).slice(2)}→${String(b.year).slice(2)}`),
    signed: true,
    series: [
      {m:'solar', label:'Erzeugung', data:ch('solar')},
      {m:'self', label:'Eigenverbrauch', data:ch('self')},
      {m:'feed', label:'Einspeisung', data:ch('tgrid')},
      {m:'grid', label:'Netzbezug', data:ch('fgrid')},
    ],
  };
}

const CHARTS = {
  solar:    {title:'Jahreserzeugung', unit:'MWh', spec: d => yearly(d, [{m:'solar', label:'Erzeugung', k:'solar'}])},
  month:    {title:'Monatsverlauf', unit:'kWh', act:'', spec: monthSpec},
  balance:  {title:'Verwendung der Erzeugung', unit:'MWh', spec: d => yearly(d, [

  sources:  {title:'Deckung des Verbrauchs', unit:'MWh', spec: d => yearly(d, [

// ═══════════════════════════════════════════════════════════════════════════
// VIEW COMPONENTS
// ═══════════════════════════════════════════════════════════════════════════
const stat = (m, label, [v, u = ''], sub = '', delta = '') =>
  `<div class="stat m-${m}"><p class="stat-l">${label}</p><p class="stat-v">${v}${u ? `<small>${u}</small>` : ''}</p>`
  + (sub ? `<p class="stat-s">${sub}</p>` : '') + delta + '</div>';

// Change vs. previous full year; colour follows whether the direction is desirable
function delta(cur, prev, ref, {pp = false, better = 'up'} = {}) {
  if (prev == null || (!pp && !prev)) return '';
  const diff = pp ? cur - prev : (cur / prev - 1) * 100;
  const flat = Math.abs(diff) < .05;
  const st = flat ? '' : (diff > 0) === (better === 'up') ? 'pos' : 'neg';
  return `<p class="delta${st ? ' st-' + st : ''}">${flat ? '→' : diff > 0 ? '↑' : '↓'} ${signed(diff)}${NBSP}${pp ? 'Pp.' : '%'}<span>ggü. ${ref}</span></p>`;
}

const meter = p => `<div class="meter m-${p.m}"><span>${p.label} <small>${p.w}${NBSP}%</small></span><b>${pct(p.v * 100, 0)}</b><i style="--v:${p.v.toFixed(3)}"></i></div>`;
const icon = id => `<svg class="i" aria-hidden="true"><use href="#i-${id}"/></svg>`;

function scoreHtml(d) {
  const s = d.score, st = s >= 85 ? 'pos' : s >= 70 ? 'warn' : 'neg';
  const rating = s >= 90 ? 'Herausragend' : s >= 80 ? 'Ausgezeichnet' : s >= 70 ? 'Sehr gut' : s >= 55 ? 'Gut' : 'Ausbaufähig';
  return `<div class="ring st-${st}" style="--p:${s / 100}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="42"/><circle class="vl" cx="50" cy="50" r="42"/></svg><b aria-hidden="true">${s}</b></div>`
    + `<div class="score-body"><p class="eyebrow">Netz-Unabhängigkeit ${d.lf.year}</p><p class="score-r">${rating} <span class="sr-only">– ${s} von 100 Punkten</span></p>`
    + `<div class="meters">${d.parts.map(meter).join('')}</div></div>`;
}

function benefitsHtml(d) {
  const items = [
    ['lock', 'Preisstabilität', `${pct(d.lf.autarky, 0)} des Verbrauchs ${d.lf.year} sind vom Strompreis entkoppelt.`],
    ['shield', 'Notstrom', 'Die Powerwall versorgt den Haushalt bei Netzausfall, typisch ~18–24 h.'],
    ['building', 'Immobilienwert', 'PV mit Speicher steigert den Marktwert typischerweise um 5–10 %.'],
  ];
  return `<h3>Weitere Vorteile</h3><ul class="list">${items.map(([i, t, x]) => `<li>${icon(i)}<b>${t}</b><span>${x}</span></li>`).join('')}</ul>`;
}

function tableHtml(d) {
  const cols = [['solar','Erzeugung','MWh',1], ['self','Eigenverbr.','MWh',1], ['tgrid','Einspeisung','MWh',1], ['pw','Powerwall','MWh',2],
                ['fgrid','Netzbezug','MWh',2], ['autarky','Autarkie','%',1], ['sav','Ersparnis','€',0], ['co2','CO₂','kg',0]];
  const full = d.Y.filter(y => y.full);
  const top = Object.fromEntries(cols.map(([k,,, dec]) =>
    [k, full.length > 1 ? num(best(full, k, k === 'fgrid')[k], dec) : null]));
  const row = (y, tag) => `<tr${tag === 'Prognose' ? ' class="fc"' : ''}><td>${y.year}${tag ? `<span class="tag">${tag}</span>` : ''}</td>`
    + cols.map(([k,,, dec]) => {
      if (y[k] == null) return '<td>–</td>';
      const v = num(y[k], dec);
      return `<td${y.full && v === top[k] ? ' class="best"' : ''}>${v}</td>`;
    }).join('') + '</tr>';
  return `<h3>Jahresübersicht</h3><div class="tbl-wrap"><table class="tbl"><caption class="sr-only">Kennzahlen je Jahr, Ist und Prognose</caption>`
    + `<thead><tr><th scope="col">Jahr</th>${cols.map(([, l, u]) => `<th scope="col">${l}<small>${u}</small></th>`).join('')}</tr></thead>`
    + `<tbody>${d.Y.map(y => row(y, tagOf(y))).join('')}${d.future.map(f => row(f, 'Prognose')).join('')}</tbody></table></div>`
    + `<p class="note">Fett: Bestwert der Volljahre · Prognose ohne Speicher-, Netz- und Autarkiewerte</p>`;
}

const li = ([t, x]) => `<li><strong>${t}:</strong> ${x}</li>`;

    },
    insights: d => {

      if (d.isMonthly) {

  verbrauch: {

    layout: ['stats', 'score', ['sources', 'rates'], 'insights'],
    stats: ({tot, Y, lf, pf}) => [
      stat('home', 'Verbrauch gesamt', energy(tot.home), span(Y)),

      stat('solar', `Eigenverbrauchsquote ${lf.year}`, [num(lf.evq), '%'], '', delta(lf.evq, pf?.evq, pf?.year, {pp:true})),

      out.push(['Verbrauch', `Ø ${E(d.avg.home)} pro Volljahr, Spanne ${E(best(F, 'home', true).home)}–${E(best(F, 'home').home)}.`]);
      out.push(['Score', `Der Unabhängigkeits-Score gewichtet Autarkie (65 %), Speicherdeckung – den Anteil der Powerwall am Nicht-Solar-Bezug (20 %) – und die Entwicklung seit ${ff.year} (15 %).`]);

const SHELLS = {
  stats: '<div class="stats" data-block="stats"></div>',
  score: '<div class="card score" data-block="score"></div>',
  benefits: '<div class="card" data-block="benefits"></div>',
  table: '<div class="card" data-block="table"></div>',
  insights: () => `<details class="card insights" data-block="insights"${matchMedia('(min-width:768px)').matches ? ' open' : ''}>`
    + `<summary>Analyse <small></small>${icon('chevron')}</summary><ul></ul></details>`,
};

// ═══════════════════════════════════════════════════════════════════════════
// RENDERING — lazy per view; price changes only redraw price-dependent charts
// ═══════════════════════════════════════════════════════════════════════════
const ro = new ResizeObserver(entries => {
  for (const {target} of entries) if (target.clientWidth && (target._dirty || target.clientWidth !== target._w)) drawChart(target);
});
const views = Object.fromEntries(Object.keys(VIEWS).map(id => [id, {el: $('#p-' + id), built:false, pending:null}]));

function fill(id, scope) {
  const el = views[id].el;
  for (const b of el.querySelectorAll('[data-block]')) BLOCKS[b.dataset.block](b, data, id);
  for (const p of el.querySelectorAll('.plot')) {
    if (scope !== 'all' && !CHARTS[p.dataset.chart].price) continue;
    p._dirty = true;
    drawChart(p);
  }
}

function ensure(id) {
  const v = views[id];
  if (!v.built) {
    v.el.innerHTML = `<h2 class="sr-only">${VIEWS[id].label}</h2>` + VIEWS[id].layout.map(b =>
      Array.isArray(b) ? `<div class="row">${b.map(chartCard).join('')}</div>` : typeof SHELLS[b] === 'function' ? SHELLS[b]() : SHELLS[b]).join('');
    v.el.querySelectorAll('.plot').forEach(p => ro.observe(p));
    v.built = true;
    v.pending = 'all';
  }
  if (v.pending) { fill(id, v.pending); v.pending = null; }
}

function render(scope) {
  data = derive(state);
  const d = data, src = state.source || 'Beispieldaten';
  $('#meta').textContent = `${span(d.Y)} · ${src}`;
  $('#src').textContent = src;
  $('#btn-reset').hidden = !state.source;
  $('#kpis').innerHTML = [
    stat('solar', 'Erzeugung', energy(d.tot.solar)),
    stat('self', `Autarkie ${d.lf.year}`, [num(d.lf.autarky), '%']),
    stat('money', 'Ersparnis', [num(d.tot.sav, 0), '€']),
    stat('money', 'Amortisiert', [num(d.roi.progress * 100, 0), '%']),
    stat('co2', 'CO₂ vermieden', [num(d.tot.co2, 0), 'kg']),
  ].join('');
  for (const [id, v] of Object.entries(views)) {
    if (!v.built) continue;
    if (id === current) fill(id, scope);
    else v.pending = v.pending === 'all' ? 'all' : scope;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════════════════════════
const tabs = [...document.querySelectorAll('[role=tab]')];
const tablist = $('#tablist'), dock = $('#dock'), main = $('#main');

function select(id, initial = false) {
  if (!VIEWS[id]) id = 'erzeugung';
  current = id;
  for (const t of tabs) {
    const on = t.dataset.view === id;
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
  }
  for (const [vid, v] of Object.entries(views)) v.el.hidden = vid !== id;
  ensure(id);
  if (initial) return;
  history.replaceState(null, '', '#' + id);
  const t = tabs.find(x => x.dataset.view === id);
  const l = t.offsetLeft, r = l + t.offsetWidth;
  if (l < tablist.scrollLeft) tablist.scrollLeft = l - 24;
  else if (r > tablist.scrollLeft + tablist.clientWidth) tablist.scrollLeft = r - tablist.clientWidth + 24;
  const top = main.offsetTop - dock.offsetHeight;
  if (scrollY > top) scrollTo(0, top); // stuck dock: start the new view at its top
}

tablist.addEventListener('click', e => { const t = e.target.closest('[role=tab]'); if (t) select(t.dataset.view); });
tablist.addEventListener('keydown', e => {
  const i = tabs.indexOf(document.activeElement);
  const j = {ArrowRight:i + 1, ArrowLeft:i - 1, Home:0, End:tabs.length - 1}[e.key];
  if (i < 0 || j == null) return;
  e.preventDefault();
  const t = tabs[(j + tabs.length) % tabs.length];
  t.focus();
  select(t.dataset.view);
});
addEventListener('hashchange', () => select(location.hash.slice(1)));

// ── Chart tooltips: one delegated listener for every plot ──────────────────
let hovered = null;
function onPointer(e) {
  const plot = e.target.closest?.('.plot');
  if (plot !== hovered) { hideTip(hovered); hovered = plot; }
  if (plot?._g) showTip(plot, Math.floor((e.clientX - plot.getBoundingClientRect().left - plot._g.x0) / plot._g.band));
}
document.addEventListener('pointermove', onPointer, {passive:true});
document.addEventListener('pointerdown', onPointer, {passive:true});
main.addEventListener('focusin', e => { if (e.target._g) showTip(e.target, e.target._s.labels.length - 1); });
main.addEventListener('focusout', e => { if (e.target._g) hideTip(e.target); });
main.addEventListener('keydown', e => {
  const p = e.target;
  if (!p._g) return;
  const n = p._s.labels.length, i = p._i ?? n - 1;
  const j = {ArrowRight:i + 1, ArrowLeft:i - 1, Home:0, End:n - 1}[e.key];
  if (j == null) return;
  e.preventDefault();
  showTip(p, j);
});
main.addEventListener('change', e => {
  if (!e.target.matches('[data-month]')) return;
  const plot = e.target.closest('figure').querySelector('.plot');
  plot._year = +e.target.value;
  drawChart(plot);
});

// ── Settings ───────────────────────────────────────────────────────────────
const settings = $('#settings'), btnSettings = $('#btn-settings');
const inputs = {buy:$('#in-buy'), sell:$('#in-sell'), cost:$('#in-cost')};
const inRange = (k, v) => Number.isFinite(v) && v >= LIMITS[k][0] && v <= LIMITS[k][1];

function toggleSettings(open, focus) {
  settings.hidden = !open;
  btnSettings.setAttribute('aria-expanded', open);
  if (open) (focus || inputs.buy).focus({preventScroll:true});
  else btnSettings.focus({preventScroll:true});
}
btnSettings.addEventListener('click', () => toggleSettings(settings.hidden));
settings.addEventListener('keydown', e => { if (e.key === 'Escape') toggleSettings(false); });
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) toggleSettings(false);
  const open = e.target.closest('[data-open]');
  if (open) toggleSettings(true, $('#' + open.dataset.open));
});

const save = () => {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({buy:state.buy, sell:state.sell, cost:state.cost, rows:state.source ? state.rows : null, source:state.source})); }
  catch { /* storage unavailable — settings stay session-only */ }
};
let priceTimer;
for (const [k, el] of Object.entries(inputs)) {
  el.addEventListener('input', () => {
    const v = el.valueAsNumber, ok = inRange(k, v);
    el.setAttribute('aria-invalid', !ok);
    if (!ok || v === state[k]) return;
    state[k] = v;
    clearTimeout(priceTimer);
    priceTimer = setTimeout(() => { render('price'); save(); }, 200);
  });
  el.addEventListener('change', () => { // normalise out-of-range or empty input on blur
    if (inRange(k, el.valueAsNumber)) return;
    el.value = Number.isFinite(el.valueAsNumber) ? clamp(el.valueAsNumber, ...LIMITS[k]) : state[k];
    el.setAttribute('aria-invalid', false);
    el.dispatchEvent(new Event('input'));
  });
}

// ── Data: CSV upload, drag & drop, reset ───────────────────────────────────
const toastEl = $('#toast');
let toastTimer;
function toast(msg, err = false) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
}

async function loadFile(file) {
  if (!file) return;
  if (!/\.csv$/i.test(file.name) && file.type !== 'text/csv') return toast('Bitte eine CSV-Datei wählen.', true);
  if (file.size > 2e6) return toast('Die Datei ist zu groß (max. 2 MB).', true);
  try {
    const rows = parseCSV(await file.text());
    Object.assign(state, {rows, source:file.name});
    render('all');
    save();
    toast(`${file.name}: ${data.Y.length} Jahre geladen (${span(data.Y)})`);
  } catch (err) { toast(err.message, true); }
}

document.addEventListener('change', e => {
  if (!e.target.matches('[data-csv]')) return;
  loadFile(e.target.files[0]);
  e.target.value = '';
});
$('#btn-reset').addEventListener('click', () => {
  Object.assign(state, {rows:SAMPLE, source:null});
  render('all');
  save();
  toast('Beispieldaten geladen');
});

let dragDepth = 0;
const hasFiles = e => e.dataTransfer?.types.includes('Files');
addEventListener('dragenter', e => { if (hasFiles(e) && ++dragDepth === 1) document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  loadFile(e.dataTransfer.files[0]);
});

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
const validRow = r => r && Number.isInteger(r.year) && ['home','powerwall','solar','fromGrid','toGrid'].every(k => Number.isFinite(r[k]));
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
  for (const k of Object.keys(LIMITS)) if (inRange(k, saved[k])) state[k] = saved[k];
  if (Array.isArray(saved.rows) && saved.rows.length && saved.rows.every(validRow)) Object.assign(state, {rows:saved.rows, source:String(saved.source || 'Eigene Daten')});
} catch { /* ignore corrupt or blocked storage */ }
for (const [k, el] of Object.entries(inputs)) el.value = state[k];

render('all');
select(location.hash.slice(1), true);
</script>
